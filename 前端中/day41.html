        // bind
        // 1. 不会调用函数
        // 2. 改变this指向
        // 3. 返回一个新的函数，但是这个函数的this指向已经改变
        const obj = {uname:'pink'}
        function func(x,y){
            console.log(this);
            console.log(x,y);
        }
        const fn = func.bind(obj)    // 不会调用函数，返回一个新的函数
        fn(1,2)

        // 需求：按钮的禁用
        document.querySelector('button').addEventListener('click',function(){
            // 这里的this指向的是button （普通函数）
            this.disabled = true      // 禁用按钮

            // 方式二：
            setTimeout(() => {

                this.disabled = false     // 启用按钮
