    <div class="box">
        <h1 class="title">新用户注册</h1>
        <form action="" autocomplete="off">
            <input type="text" name="uname" id="uname" placeholder="设置用户名称">
            <p class="uname">昵称长度为6至10个字符</p>
            <input type="text" name="phone" id="phone" placeholder="输入手机号码">
            <p class="phone">请输入正确的手机号</p>
            <input type="text" name="emailnum" id="emailnum" placeholder="短信验证码">
            <p class="emailnum">请输入正确的验证码</p>
            <input type="password" name="pwd" id="pwd" placeholder="设置6至20位字母,数字和符号组合">
            <p class="pwd">设置6至20位字母,数字和符号组合</p>
            <input type="password" name="pwdAgin" id="pwdAgin" placeholder="请再次输入上面密码">
            <div>
                <input type="checkbox" name="read" id="read">
                <p class="text">
                    <span>已阅读并同意</span>
                    <span style="color: rgb(133, 203, 77);"> <用户服务协议> </span>
                </p>
            </div>
            <button class="submit">下一步</button>
        </form>
    </div>

        const uname = document.querySelector('#uname')
        // 用户名验证（用字母，数字，下划线，横杆，一共6~10位）
        function testUname(){
            const reg = /^[a-zA-Z0-9_-]{6,10}$/
            if(!reg.test(uname.value)){
                document.querySelector('.uname').style.display = 'block'
                return false
            }
            else{
                document.querySelector('.uname').style.display = 'none'
                return true
            }
        }
        uname.addEventListener('change',testUname)

        const phone = document.querySelector('#phone')
        // 手机号验证（1开头，第二位3-8，后面9位）
        function testPhone(){
            const reg = /^[1][3-8][0-9]{9}$/
            if(!reg.test(phone.value)){
                document.querySelector('.phone').style.display = 'block'
                return false
            }
            else{
                document.querySelector('.phone').style.display = 'none'
                return true
            }
        }
        phone.addEventListener('change',testPhone)

        const emailnum = document.querySelector('#emailnum')
        // 验证码验证（6位数字）
        function testEmailnum(){
            const reg = /^[0-9]{6}$/
            if(!reg.test(emailnum.value)){
                document.querySelector('.emailnum').style.display = 'block'
                return false
            }
            else{
                document.querySelector('.emailnum').style.display = 'none'
                return true
            }
        }
        emailnum.addEventListener('change',testEmailnum)

        const pwd = document.querySelector('#pwd')
        // 密码验证（6-20位，字母，数字，下划线）
        function testPwd(){
            const reg = /^[a-zA-Z0-9_]{6,20}$/
            if(!reg.test(pwd.value)){
                document.querySelector('.pwd').style.display = 'block'
                return false
            }
            else{
                document.querySelector('.pwd').style.display = 'none'
                return true
            } 
        }
        pwd.addEventListener('change',testPwd)

        // 调用所有验证
        function blurAll(){
            let flag = false
            // 验证
            if(testUname() & testPhone() & testEmailnum() & testPwd()){
                flag = true
            }
            return flag
        }

        const pwdAgin = document.querySelector('#pwdAgin')
        // 勾选后的验证
        function check(e){
            if(blurAll() && pwdAgin.value === pwd.value){
                // 验证通过
                alert('注册成功')
                clear()
            }
            else{
                // 验证不通过
                e.preventDefault()  // 阻止提交
                alert('密码或验证未通过')
            }
        }

        // 表单清空
        function clear(){
            const form = document.querySelector('form')
            form.reset()   // 重置表单
        }

        const submit = document.querySelector('.submit')
        const read = document.querySelector('#read')
        // 设置提交事件
        submit.addEventListener('click',function(e){
            if(!read.checked){
                // 无勾选已阅读
                e.preventDefault()  // 阻止提交
                alert('请先阅读用户协议')
                // 验证
                blurAll()    
            }
            else{
                // 勾选
                check(e)
            }
        })


    </script>
