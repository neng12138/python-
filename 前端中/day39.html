        // 原型继承
        function Person() {     // 父构造函数
            this.eays = 2
            this.head = 1
        }
        function Woman(){}  // 子构造函数
        Woman.prototype = new Person()  // 原型继承
        Woman.prototype.constructor = Woman  // 恢复指向构造函数
        Woman.prototype.baby = function(){
            console.log('baby');
        }
        const red = new Woman()  // 实例对象
        console.log(red)
        
        function Man(){}    // 子构造函数
        Man.prototype = new Person()  // 原型继承
        Man.prototype.constructor = Man  // 恢复指向构造函数
        Man.prototype.play = function(){
            console.log('play');
        }
        const blue = new Man()  // 实例对象
