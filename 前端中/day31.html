        *{

            padding: 0;
        }
        .box{
                width: 1000px;
                height: 500px;
                margin: 100px auto;
        }
        .top{
            position: relative;
            width: 100%;
            height: 250px;
        }
        .top-title{
            position: absolute;
            top: 5%;
            left: 41%;
            font-size: 40px;
        }
        .add{
            position: absolute;
            bottom: 30%;
            left: -5px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .add input,select{
            outline: none;
            width: 100px;
            height: 30px;
            border: 1px solid rgb(9, 112, 153);
            border-radius: 7px;
            margin-right: 25px;
            margin-left: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: 550;
        }
        .add #age,select{
            width: 80px;
        }
        .add h3{
            font-size: 20px;
            font-weight: 250px;
        }
        .add .submit{
            width: 70px;
            height: 30px;
            background-color: rgb(7, 9, 138);
            color: white;
            font-size: 18px;
            text-align: center;
            line-height: 30px;
            border:none;
            border-radius: 7px;
            cursor: pointer;
        }
        .bottom{
            position: relative;
            width: 100%;
            height: 250px;
        }
       .bottom-title{
            position: absolute;
            top: 5%;
            left: 43%;
            font-size: 40px;
        }
        .bottom table{
            position: absolute;
            top: 35%;
            left: -5%;
            width: 110%;
            border: 1px solid rgba(164, 165, 166,0.5);
            text-align: center;
            font-size: 20px;
            font-weight: 550;
        }
        .bottom table tr:first-child{
            background-color: rgb(168, 209, 226);
        }
       .bottom table tr{
            height: 60px;
        }
        .bottom table tr:not(:first-child):hover{
            background-color: rgba(208, 209, 209, 0.3);
        }
        .bottom table tr td.remove{
            color: rgb(7, 9, 138);
            text-decoration: underline;
            text-decoration-color: rgb(7, 9, 138);
            cursor: pointer;
        }

    <div class="box">
        <div class="top">
            <h1 class="top-title">新增学员</h1>
            <div class="add">
                <h3>姓名:</h3>
                <input type="text" id="name">
                <h3>年龄:</h3>
                <input type="text" id="age">
                <h3>性别:</h3>
                <select id="gender">
                    <option selected>男</option>
                    <option>女</option>
                </select>
                <h3>薪资:</h3>
                <input type="text" id="salary">
                <h3>就业城市:</h3>
                <select id="city">
                    <option  selected>北京</option>
                    <option >广州</option>
                    <option >浙江</option>
                    <option >海南</option>
                    <option >珠海</option>
                </select>
                <button class="submit">录入</button>
            </div>
        </div>
        <div class="bottom">
            <h1 class="bottom-title">就业榜</h1>
            <table cellspacing="0" border="1px solid rgba(14, 123, 196,0.5)">
                <tr>
                    <td>学号</td>
                    <td>姓名</td>
                    <td>年龄</td>
                    <td>性别</td>
                    <td>薪资</td>

            </table>
        </div>

        const add = document.querySelector('.top .add');
        const table = document.querySelector('.bottom table');

        // 清空录入框
        function clear(){
            add.children[1].value = ''    // name
            add.children[3].value = ''     // age
            add.children[5].value = '男'   // gender
            add.children[7].value = ''     // salary
            add.children[9].value = '北京' // city
            // 方式二： form.reset()  （form表单的重置方法）
        }

        // 追加在table中
        let num = 1001;  // 学号 （每次点击后加1）
        function addData(){
            const tr = document.createElement('tr');    // 创建新节点tr
                tr.innerHTML = `
                         <td>${num++}</td>
                         <td>${add.children[1].value}</td>
                         <td>${add.children[3].value}</td>
                         <td>${add.children[5].value}</td>
                         <td>${add.children[7].value}</td>
                         <td>${add.children[9].value}</td>
                         <td class="remove">删除</td>`
                table.appendChild(tr);    // 追加新节点tr到table末尾
        }

        // 检查数据是否可以提交
        function check(){
            let flag = true;    // 假设数据是可以提交的
            if(add.children[1].value === '' || add.children[3].value === '' || add.children[7].value === ''){
                    // 如果姓名、年龄、薪资其中一个有空值，则数据不可提交
                    alert(' 数据不能为空！');
                    flag = false;    // 数据不可提交
            }
            return flag;    // 返回flag
        }

        // 删除事件
        function cancel(){
            // 方式一： 为每行添加的数据添加删除事件
            // 方式一要每次都添加删除事件，因此要写在录入信息中
            const new_tr = table.children[table.children.length-1]
            // console.log(new_tr);    // 选择新节点tr
            const remove = new_tr.children[new_tr.children.length-1]
            // console.log(remove);     // 选择新节点tr中的removed对象
            remove.addEventListener('click',function(){
                // 只要点击删除，父元素table直接删除此节点new_tr
                table.removeChild(new_tr)
            })
            // // 方式二： 父元素table的事件委托

        // 录入信息
        const submit = add.children[10]
        submit.addEventListener('click',function(){
            // 检查数据是否可以提交
                if(check()){
                    // 追加在table中
                    addData()
                    // 录入框清空
                    clear()
                    // 添加删除事件
                    cancel()
                }
