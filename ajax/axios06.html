<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传</title>
    <!-- bootstrap.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 350px;
            height: 350px;
            margin: 100px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }

        .box h3 {
            font-size: 20px;
            font-weight: 500;
            margin-left: -160px;
            margin-top: 20px;
        }

        .box img {
            margin-top: -25px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
        }

        .box div {
            margin-top: -14px;
        }

        .box label {
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            background-color: rgba(5, 161, 222, 0.8);
            color: white;
        }

        .box label:hover {
            background-color: rgba(5, 161, 222, 1);
        }

        .my-toast{
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <!-- 文件上传元素 -->
    <!-- <div>
        lable的for属性和input的id属性一致 （关联）
        <label for="input-file" style="border: 1px solid black;">上传图片</label>
        <input type="file" class="input-file" id="input-file" style="display: none;">
     </div> -->
    <!-- <img src="" alt="" class="input-img" width="600px"> -->

    <div class="toast align-items-center text-bg-primary border-0 my-toast" data-bs-delay="1500" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="d-flex" style="background-color: rgb(43, 182, 43);">
            <div class="toast-body">
                头像上传成功
            </div>
        </div>
    </div>
    <div class="box">
        <h3>头像</h3>
        <img src="../../爬虫/image_2.jpg" alt="" class="input-img" width="185px">
        <div>
            <!-- label关联input -->
            <label for="input-file">上传图片</label>
            <!-- input的file类型用于上传文件 -->
            <input type="file" class="input-file" id="input-file" style="display: none;">
        </div>
    </div>


    <!-- bootstrap.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <!-- axios.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 黑马后端接口文档 -- https://www.apifox.cn/apidoc/docs-site/1937884/doc-1695440

        // // 监听文件上传元素的change事件
        // document.querySelector('.input-file').addEventListener('change', function (e) {
        //     // console.log(e.target.files)    // 伪数组 （包含上传的文件）
        //     // console.log(e.target.files[0])
        //     // 创建表单数据对象 （form-data）
        //     const fd = new FormData()
        //     // 将文件添加到表单数据对象中
        //     fd.append('img', e.target.files[0])
        //     // 发送ajax请求
        //     axios({
        //         url:'https://hmajax.itheima.net/api/uploadimg',
        //         method:'post',
        //         data:fd
        //     }).then(res => {
        //         console.log(res.data.data.url);
        //         // 显示在网页上
        //         document.querySelector('.input-img').src = res.data.data.url
        //         // 本地存储
        //         localStorage.setItem('imgUrl',res.data.data.url)
        //     })
        // })

        // // 页面加载完成后 从本地存储中获取图片url 并显示在网页上
        // window.addEventListener('load', function () {
        //     const imgUrl = localStorage.getItem('imgUrl')
        //     imgUrl && (document.querySelector('.input-img').src = imgUrl)
        // })

        document.querySelector('.input-file').addEventListener('change', e => {
            // console.log(e.target.files[0])
            const fd = new FormData()
            fd.append('img', e.target.files[0]) // e.target.files[0] -> 刚刚上传的文件
            axios({
                url: 'https://hmajax.itheima.net/api/uploadimg',
                method: 'post',
                data: fd
            }).then(res => {
                console.log(res.data.data.url)
                document.querySelector('.input-img').src = res.data.data.url
                // 上传成功后 显示toast
                const addtoast = document.querySelector('.my-toast')
                const toast = new bootstrap.Toast(addtoast)
                toast.show()
            })
        })


    </script>
</body>

</html>
