        // XHR传提交参数 -- 1. 写请求头  2. data对象传入send()方法中 （data要转为字符串形式）
        // 模拟axios函数处理提交参数（data）
        function myAxios(config) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest()
                // 获取查询参数
                if (config.params) {      // 有查询参数
                    const paramsObj = new URLSearchParams(config.params)
                    const paramsStr = paramsObj.toString()
                    config.url += `?${paramsStr}`    // 在url后面添加查询参数
                }
                xhr.open(config.method || 'GET', config.url)
                xhr.addEventListener('loadend', () => {
                    if (xhr.readyState == 4 && xhr.status == 200) {   // 成功
                        resolve(JSON.parse(xhr.response))
                    } else {          // 失败
                        reject(new Error(xhr.response))
                    }
                })
                // 提交参数 （form-data）
                if (config.data) {
                    xhr.setRequestHeader('Content-Type', 'application/json') // 设置请求头
                    xhr.send(JSON.stringify(config.data))   // 设置请求体
                } else {
                    xhr.send()
                }
            })
        }
