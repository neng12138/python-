        button.my-btn{
            margin: 50px;
            width: 100px;
            height: 50px;
            border-radius: 10px;
            background-color: rgb(6, 135, 186);
            border: none;
            font-size: 17px;
            font-weight: 530;
        }
        button.my-btn:hover{
            background-color: rgba(4, 110, 153,0.7);
        }
        .my-input{
            width: 200px;
            height: 30px;
            border-radius: 5px;
            border: 1px solid rgba(0,0,0,0.3);
            font-size: 15px;
            padding-left: 10px;
            margin-top: 5px;
            margin-left: 20px;
        }
    </style>

    <!-- js设置隐藏与显示 -->
    <button class="my-btn">显示弹窗</button>
    <!-- 引入bootstrao的标签 （默认display:none） -->
    <div class="modal my-box" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- 弹窗的顶部 -->
                <div class="modal-header">
                    <h5 class="modal-title">请输入姓名</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- 弹窗的中部 -->
                <div class="modal-body">
                    <p>
                        <input class="my-input" type="text" placeholder="请输入姓名">
                    </p>
                </div>
                <!-- 弹窗的底部 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary success">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入bootstrap的js文件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
        const bsmodal = document.querySelector('.my-box')
        const modal = new bootstrap.Modal(bsmodal)

        document.querySelector('.my-btn').addEventListener('click',()=>{
            document.querySelector('.my-input').value = 'jump'
            // 显示
            modal.show()
        })

        document.querySelector('.success').addEventListener('click',()=>{
            const data = document.querySelector('.my-input').value
            console.log(data)
            // 隐藏
            modal.hide()
        })
    </script>
