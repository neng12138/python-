        document.querySelector('.zc').addEventListener('click',function(){
            // 前端请求后端要考虑成功和失败两种情况
            axios({     // 传一个对象
                url: 'http://hmajax.itheima.net/api/register',
                method:'post',
                data:{
                    username:'itheima12138',
                    password:'123456'
                }
            }).then(res => {    // 箭头函数
                // 成功
                console.log(res);
            }).catch(error => {     // 箭头函数
                // 失败
                // 处理错误信息
                console.log(error);
                console.log(error.response.data.message);
            })
            
        })

        document.querySelector('.dl').addEventListener('click',function(){
