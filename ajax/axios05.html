<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 1100px;
            height: 600px;
            margin: 100px auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .head {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 80px;
        }

        .head-text {
            margin: 25px;
            font-size: 40px;
        }

        .add-btn {
            margin: 25px;
            margin-right: 50px;
            font-size: 22px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: rgb(24, 144, 192);
            border: none;
            color: white;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: rgba(24, 144, 192, 0.7);
        }

        .body {
            width: 100%;
            height: 500px;
        }

        .book-list {
            text-align: center;
            margin-top: 20px;
            margin-left: 20px;
            width: 95%;
            border-collapse: collapse;
            font-size: 18px;
        }

        .book-list tr:first-child {
            background-color: rgb(133, 134, 134);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid white;
        }

        .book-list tr:not(:first-child) {
            color: rgba(0, 0, 0, 0.7);
            border: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.7);
            font-size: 20px;
        }

        .book-list tr:first-child th {
            border-left: 1px solid white;
        }

        .book-list tr {
            height: 60px;
        }

        .operation {
            display: flex;
            justify-content: space-around;
        }

        .operation span {
            cursor: pointer;
        }

        .edit {
            color: chocolate;
        }

        .del {
            color: skyblue;
        }

        div.modal {
            margin-top: 200px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .modal-body p {
            color: rgba(0, 0, 0, 0.8);
            font-size: 16px;
            margin-left: 30px;
            margin-bottom: 5px;
        }

        .modal-body .my-input {
            margin-left: 30px;
            margin-bottom: 30px;
            width: 400px;
            height: 35px;
            padding: 15px 10px;
            border-radius: 5px;
            outline: none;
            border: 1px solid rgba(0, 0, 0, 0.6);
        }

        .modal-footer {
            display: flex;
            justify-content: space-around;
        }

        .modal-footer button {
            margin-top: 10px;
            width: 120px;
            height: 40px;
            font-weight: 500;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .modal-footer button:last-child:hover {
            background-color: rgba(24, 144, 192, 0.9);
        }
    </style>
</head>
<body>
    <!-- 主体标签 -->
    <div class="box">
        <div class="head">
            <h1 class="head-text">图书管理</h1>
            <div class="add-book">
                <button class="add-btn" data-bs-toggle="modal" data-bs-target=".add-modal">+ 添加</button>
            </div>
        </div>
        <div class="body">
            <table cellspacing="0" class="book-list">
                <tr>
                    <th>序号</th>
                    <th>书名</th>
                    <th>作者</th>
                    <th>出版社</th>
                    <th>操作</th>
                </tr>
                <!-- <tr>
                    <th>1</th>
                    <th>三国演义</th>
                    <th>罗贯中</th>
                    <th>罗贯中出版社</th>
                    <th>
                       <div class="operation">
                           <span class="edit">编辑</span>
                           <span class="del">删除</span>
                       </div>
                    </th>
                </tr> -->
            </table>
        </div>
    </div>
    <!-- 添加图书弹窗 -->
    <div class="modal add-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- 弹窗的顶部 -->
                <div class="modal-header">
                    <h5 class="modal-title" style="margin-left: 180px;">添加图书</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- 弹窗的中部 -->
                <div class="modal-body">
                    <form class="add-form">
                        <input class='id' type="text" name="id" style="display: none;">
                        <div>
                            <p>书名</p>
                            <input class="bookname my-input" type="text" name="bookname" placeholder="请输入书名">
                        </div>
                        <div>
                            <p>作者</p>
                            <input class="author my-input" type="text" name="author" placeholder="请输入作者">
                        </div>
                        <div>
                            <p>出版社</p>
                            <input class="publisher my-input" type="text" name="publisher" placeholder="请输入出版社">
                        </div>
                    </form>
                </div>
                <!-- 弹窗的底部 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary add-book-btn">保存</button>
                </div>
            </div>
        </div>
    </div>
    <!-- 编辑图书弹窗 -->
    <div class="modal edit-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- 弹窗的顶部 -->
                <div class="modal-header">
                    <h5 class="modal-title" style="margin-left: 180px;">编辑图书</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- 弹窗的中部 -->
                <div class="modal-body">
                    <form class="edit-form">
                        <input class='id' type="text" name="id" style="display: none;">
                        <div>
                            <p>书名</p>
                            <input class="bookname my-input" type="text" name="bookname" placeholder="请输入书名">
                        </div>
                        <div>
                            <p>作者</p>
                            <input class="author my-input" type="text" name="author" placeholder="请输入作者">
                        </div>
                        <div>
                            <p>出版社</p>
                            <input class="publisher my-input" type="text" name="publisher" placeholder="请输入出版社">
                        </div>
                    </form>
                </div>
                <!-- 弹窗的底部 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary edit-book-btn">修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- serialize.js -->
    <script src="form-serialize.js"></script>
    <!-- bootstrap.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <!-- axios.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 黑马后端接口文档 -- https://www.apifox.cn/apidoc/docs-site/1937884/doc-1695440

        const creator = 'jump'
        function showBookList() {       // 渲染数据
            axios({
                url: 'https://hmajax.itheima.net/api/books',
                method: 'get',
                params: {
                    creator
                }
            }).then(res => {
                // console.log(res.data.data);
                const bookList = res.data.data
                const first_list = `<tr>
                    <th>序号</th>
                    <th>书名</th>
                    <th>作者</th>
                    <th>出版社</th>
                    <th>操作</th>
                </tr>`
                const bookStr = first_list + bookList.map((item, index) => {
                    return `<tr>
                    <th>${index + 1}</th>
                    <th>${item.bookname}</th>
                    <th>${item.author}</th>
                    <th>${item.publisher}</th>
                    <th>
                       <div class="operation" data-id="${item.id}">
                           <span class="edit">编辑</span>
                           <span class="del">删除</span>
                       </div>
                    </th>
                </tr>`
                }).join('')
                document.querySelector('.body .book-list tbody').innerHTML = bookStr
            })
        }
        showBookList()

        const addmodal = document.querySelector('.add-modal')
        const add_modal = new bootstrap.Modal(addmodal)
        // 新增图书 -- 保存按钮
        document.querySelector('.add-book-btn').addEventListener('click',function(){
            const my_form = document.querySelector('.add-form')
            const data = serialize(my_form,{hash:true,empty:true})
            const {bookname,author,publisher} = data
            axios({
                url:'https://hmajax.itheima.net/api/books',
                method:'post',
                data:{
                    bookname,
                    author,
                    publisher,
                    creator
                }
            }).then(res => {
                showBookList()  // 新增成功后，重新渲染数据
                my_form.reset()  // 清空输入框内容
                add_modal.hide()    // 隐藏弹窗
            })
        })

        const editmodal = document.querySelector('.edit-modal')
        const edit_modal = new bootstrap.Modal(editmodal)
        // 编辑图书 （事件委托）
        document.querySelector('.book-list').addEventListener('click',(e)=>{
            if(e.target.classList.contains('edit')){
                // console.log(e.target.parentNode.dataset.id)
                const my_id = e.target.parentNode.dataset.id
                axios({
                    url:`https://hmajax.itheima.net/api/books/${my_id}`,
                    method:'get'
                }).then(res => {
                    const data_obj = res.data.data
                    // console.log(data_obj);
                    for(let key in data_obj){
                        document.querySelector(`.edit-form .${key}`).value = data_obj[key]
                    }
                    edit_modal.show()
                })
            }
        })
        // 修改图书内容 -- 修改按钮
        document.querySelector('.edit-book-btn').addEventListener('click',()=>{
            const my_form = document.querySelector('.edit-form')
            const data = serialize(my_form,{hash:true,empty:true})
            const {id,bookname,author,publisher} = data
            axios({
                url:`https://hmajax.itheima.net/api/books/${id}`,
                method:'put',
                data:{
                    bookname,
                    author,
                    publisher,
                    creator
                }
            }).then(res => {
                showBookList()  // 修改成功后，重新渲染数据
                edit_modal.hide()   // 修改成功后，隐藏弹窗
            })
        })
        
        // 删除图书（事件委托）
        document.querySelector('.book-list').addEventListener('click',(e)=>{
            if(e.target.classList.contains('del')){
                const my_id = e.target.parentNode.dataset.id
                axios({
                    url:`https://hmajax.itheima.net/api/books/${my_id}`,
                    method:'delete'
                }).then(res => {
                    showBookList()  // 删除成功后，重新渲染数据
                })
            }
        })


    </script>
</body>

</html>
