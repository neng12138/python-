        .box{

        const title_name = document.querySelector('.title-name')
        // Tab栏转换（事件绑定）
        title_name.addEventListener('mouseover', function(e){
            if(e.target.tagName === 'H3'){
                document.querySelector('.title-name h3.title-name-hover').classList.remove('title-name-hover')
                e.target.classList.add('title-name-hover')

                document.querySelector('.bottom div.active').classList.remove('active')
                // 通过自定义属性data-id获取到当前点击的是第几个子元素
                document.querySelector(`.bottom .list-item:nth-child(${+e.target.dataset.id})`).classList.add('active')
            }
            // console.log(e.target.dataset.id);    // 获取到data-id的值（string）
        })
        //  mouseover 鼠标移入  mouseout 鼠标移出      （会冒泡）
        //  mouseenter 鼠标移入  mouseleave 鼠标移出  （不会冒泡）

    </script>
