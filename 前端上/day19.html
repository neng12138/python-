<!DOCTYPE html>

        let my_age = prompt('请输入你的年龄')   // 变量接收输入框的输入数据
        let my_gender = prompt('请输入你的性别')   // 变量接收输入框的输入数据
        document.write(`我的名字是：${my_name},  我的年龄是：${my_age},  我的性别是：${my_gender}`)  // 输出到网页上（body）
        
    </script>
