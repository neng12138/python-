        const input_mi = document.querySelector('.mi input')
        const result_list = document.querySelector('.mi .result-list') 
        // 监听聚焦事件
        input_mi.addEventListener('focus',function(){
            // 显示 -- display:block;
            result_list.style.display = 'block'
            // 设置样式
            input_mi.classList.add('search')
        })
        // 监听失焦事件
        input_mi.addEventListener('blur',function(){
            // 隐藏 -- display:none;
            result_list.style.display = 'none'
            // 取消样式
            input_mi.classList.remove('search')
        })
