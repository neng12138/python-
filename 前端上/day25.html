        .box{
            display: flex;
            flex-direction: column;
            background-color: rgb(122,141,21);
            margin: 100px auto;
            width: 500px;
            height: 400px;
        }
        .top{
            width: 100%;
            height: 310px;
        }
        .bottom{
            position: relative;
            width: 100%;
            height: 90px;
        }
        .list{
            position:absolute;
            bottom: 0px;
            display: flex;
            justify-content: space-around;
            width: 200px;
            margin-left: -25px;
        }
        ul li{
            list-style: none;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.7);
        }
        .button{
            position: absolute;
            top: 20px;
            right: 15px;
        }
        button{
            cursor: pointer;
            width: 30px;
            height: 30px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            border-radius: 10%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .text{
            position: absolute;
            left: 20px;
            font-weight: 600;
            font-size: 20px;
        }
        .active{
            margin-top: -2px;
            width: 13px;
            height: 13px;
            background-color: white;
        }

        ]
        

        // 切换为ikun中index对应的元素
        function change(index=0,ikun=[]){
            // 设置整体背景颜色
            const box = document.querySelector('.box')
            box.style.backgroundColor = ikun[index].color    // 小驼峰命名法
            
            // 设置图片
            const top_image = document.querySelector('.top img')
            top_image.src = ikun[index].src

            // 设置文字
            const bottom_text= document.querySelector('.bottom .text')
            bottom_text.innerHTML = ikun[index].p

            // 清除其他小圆点的类型
            document.querySelector('.list li.active').classList.remove('active')

            // 设置底部的小圆点
            const li = document.querySelector(`.list li:nth-child(${index+1})`)
            li.classList.add('active')
        }

        // 记录当前选中的索引
        let ikun_index  = 0 

        // 点击左右按钮
        const left = document.querySelector('.button .left')
        const right = document.querySelector('.button .right')
        left.addEventListener('click',function(){
            if(ikun_index === 0){
                ikun_index = ikun.length
            }
            ikun_index--
            change(ikun_index,ikun)
        })
        right.addEventListener('click',function(){
            if(ikun_index === ikun.length-1){
                ikun_index = -1
            }
            ikun_index++
            change(ikun_index,ikun)
        })

        // 定时器
        let interval_id = setInterval(function(){
            right.click()  // 自动点击右箭头，实现自动轮播
        },800)

        // 暂停
        const box = document.querySelector('.box')
        box.addEventListener('mouseenter',function(){
            clearInterval(interval_id)
        })
        box.addEventListener('mouseleave',function(){
            clearInterval(interval_id)  // 清除定时器
            interval_id = setInterval(function(){
                right.click()  // 自动点击右箭头，实现自动轮播
            },800)
        })

        // 鼠标移入小圆点
        const all_li = document.querySelectorAll('.list li')
        for(let i = 0;i < all_li.length; i++){
            all_li[i].addEventListener('mouseenter',function(){
                ikun_index = i
                change(ikun_index,ikun)
            })
        }
