            color: rgb(255, 0, 0, 0.6);

        // 电梯导航 
        // 监听网页的滚动（伴随元素的显示于隐藏）
        const html = document.documentElement    // html标签的对象
        const left_nav = document.querySelector('.box .left-nav');
        const title_nav = document.querySelector('.title-nav');

        const location_top = document.querySelector('.main .location');
        const box = document.querySelector('.box');
        const locationTop = location_top.offsetTop + box.offsetTop;  // 元素的顶部距离
        // 监听网页的滚动（伴随元素的显示与隐藏）
        window.addEventListener('scroll',function(){
            const n = html.scrollTop;  // 被卷去的顶部距离
            // left_nav.style.opacity = n >= 250 ? 1 : 0;

            // 侧边导航栏的显示与隐藏
            left_nav.style.opacity = n+80 >= locationTop? 1 : 0;
            // 顶部导航栏的显示与隐藏
            title_nav.style.top = n+120 >= locationTop? '0px' : '-82px';
        })
        // 事件委托（将事件绑定在父元素上，通过事件对象的target属性来判断事件源）
        left_nav.addEventListener('click',function(e){
            // console.log(typeof e.target.dataset.top)    // string
            const top = +e.target.dataset.top;  // 被卷去的头部距离
            html.scrollTop = top  // 滚动到页面的指定位置
        })
