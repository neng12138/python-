        (function(){
            // 获取元素对象
            const start_time = document.querySelector('.start-time')
            const hour = document.querySelector('.hour')
            const minute = document.querySelector('.minute')
            const second = document.querySelector('.second')

            // 拼接
            function lpad(date){
                const str = date >= 10? date : '0' + date
                return str
            }

            // 获取当前时间
            function getStartTime(){
                const date = new Date()         //获取当前时间
                const year = date.getFullYear()
                const month = date.getMonth() + 1   // 月份从0开始计数，要加1
                const day = date.getDate()
                return `今天是${year}年${month}月${day}日`
            }
            // 将当前时间显示在页面上
            start_time.innerHTML = getStartTime()

            // 获取剩余时间的时分秒
            function time(){
                const start = new Date()
                const year = start.getFullYear()
                const month = lpad(start.getMonth() + 1)
                const day = lpad(start.getDate())
                const end = new Date(`${year}-${month}-${day} 23:30:00`)

                const total = (+end - +start) / 1000;  // 相差的秒数
                // const total = (end.getTime() - +start.getTime()) / 1000; 
                const hour = lpad(Math.floor(total / 60 / 60 % 24))
                const minute = lpad(Math.floor(total / 60 % 60))
                const second = lpad(Math.floor(total % 60))
                return [hour,minute,second]
            }

            // 将时分秒显示在页面上
            function show(){
                const arr = time()
                hour.innerHTML = arr[0]
                minute.innerHTML = arr[1]
                second.innerHTML = arr[2]

                // 如果时间到了，就停止
                if(arr[0] === '00' && arr[1] === '00' && arr[2] === '00') return true
                else return false
            }

            // 初始显示
            show()

            // 定时器
            let timer_id = setInterval(function(){
                const flag = show()
                // 如果时间到了，就停止定时器
                if(flag){
                    clearInterval(timer_id)
                }
            },1000)
        })()
